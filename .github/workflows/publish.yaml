name: publish to nuget

on:
  push:
    branches:
      - release

permissions:
  contents: read

concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  publish:
    name: build, test, pack & publish
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      DOTNET_NOLOGO: true
      NUGET_USER: ${{ vars.NUGET_USER || secrets.NUGET_USER }}

    steps:
      - name: Check NuGet publishing configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_USER)) {
            throw 'Set the repository Actions variable NUGET_USER to your NuGet.org profile username (Settings > Secrets and variables > Actions > Variables). An Actions secret named NUGET_USER is also supported.'
          }

      - name: Check out repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      # Pack depends on compilation, unit tests, framework tests, and API checks.
      # Select it explicitly so NUKE's legacy Push target cannot publish separately.
      - name: Build, test and pack
        run: ./build.ps1 --target Pack

      - name: Locate package
        id: package
        shell: pwsh
        run: |
          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE 'Artifacts'
          $packages = @(Get-ChildItem -LiteralPath $artifactDirectory -Filter 'AffluentAssertions.*.nupkg' -File -ErrorAction SilentlyContinue)
          if ($packages.Count -ne 1) {
            Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Filter '*.nupkg' -Recurse -File | Select-Object -ExpandProperty FullName
            throw "Expected one AffluentAssertions package in '$artifactDirectory', found $($packages.Count). Check the Pack target output above."
          }
          Write-Host "Publishing package: $($packages[0].FullName)"
          "path=$($packages[0].FullName)" >> $env:GITHUB_OUTPUT

      - name: Log in to NuGet.org with trusted publishing
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ env.NUGET_USER }}

      - name: Publish to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: dotnet nuget push "$env:PACKAGE_PATH" --api-key "$env:NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish to GitHub Packages
        shell: pwsh
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: dotnet nuget push "$env:PACKAGE_PATH" --api-key "$env:NUGET_AUTH_TOKEN" --source "https://nuget.pkg.github.com/$env:PACKAGE_OWNER/index.json" --skip-duplicate
