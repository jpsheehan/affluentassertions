name: publish to nuget

on:
  push:
    branches:
      - release

permissions:
  contents: read

concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  publish:
    name: build, test, pack & publish
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      DOTNET_NOLOGO: true

    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      # Pack depends on compilation, unit tests, framework tests, and API checks.
      # Select it explicitly so NUKE's legacy Push target cannot publish separately.
      - name: Build, test and pack
        run: ./build.ps1 --target Pack

      - name: Log in to NuGet.org with trusted publishing
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "Artifacts/AffluentAssertions.*.nupkg" --api-key "$env:NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish to GitHub Packages
        shell: pwsh
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
        run: dotnet nuget push "Artifacts/AffluentAssertions.*.nupkg" --api-key "$env:NUGET_AUTH_TOKEN" --source "https://nuget.pkg.github.com/$env:PACKAGE_OWNER/index.json" --skip-duplicate
